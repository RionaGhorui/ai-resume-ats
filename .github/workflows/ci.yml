name: ci
on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Compile check          # catches syntax errors like the one in the original project
        run: python -m compileall -q backend frontend tests scripts
      - name: Tests                  # uses a fake embedder and fake LLM: no secrets, no downloads
        run: python -m pytest -q

  docker:
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - name: Build the image      # proves the Dockerfile works and the model download succeeds
        run: docker build -t ai-resume-ats .
